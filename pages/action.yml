name: Publish Midscene reports to GitHub Pages
description: Publish native reports, retain recent history, and add per-case screenshots and links to the job Summary.
inputs:
  artifact-name:
    description: Name of the current run's native Midscene artifact.
    required: true
  producer-result:
    description: Test job conclusion, used to distinguish infrastructure failures from passing cases.
    default: success
  history-branches:
    description: Comma-separated trusted branches whose ancestor runs may supply history. Defaults to the current branch.
    default: ${{ github.ref_name }}
outputs:
  page-url:
    description: Published GitHub Pages URL.
    value: ${{ steps.deployment.outputs.page_url }}
runs:
  using: composite
  steps:
    - name: Configure GitHub Pages
      id: pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      with:
        enablement: false
    - name: Download native results
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/midscene-pages-reports/midscene-results
    - name: Find trusted report history
      id: history
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        HISTORY_BRANCHES: ${{ inputs.history-branches }}
      run: node "$GITHUB_ACTION_PATH/src/history.mjs"
    - name: Download previous Pages artifact
      if: steps.history.outputs.run_id != ''
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ steps.history.outputs.name }}
        run-id: ${{ steps.history.outputs.run_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/midscene-pages-previous-artifact
    - name: Extract previous Pages site
      if: steps.history.outputs.run_id != ''
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/midscene-pages-previous"
        tar -xf "$RUNNER_TEMP/midscene-pages-previous-artifact/artifact.tar" -C "$RUNNER_TEMP/midscene-pages-previous"
    - name: Prepare native report and recent history
      id: site
      shell: bash
      run: |
        node "$GITHUB_ACTION_PATH/src/prepare-pages-site.mjs" \
          --site "$RUNNER_TEMP/midscene-pages-site" \
          --reports "$RUNNER_TEMP/midscene-pages-reports" \
          --run-id "$GITHUB_RUN_ID" \
          --previous "$RUNNER_TEMP/midscene-pages-previous"
    - name: Upload Pages site
      if: steps.site.outputs.report_path != ''
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        name: midscene-e2e-report-pages-${{ github.run_attempt }}
        path: ${{ runner.temp }}/midscene-pages-site
        retention-days: 90
    - name: Deploy Pages site
      id: deployment
      if: steps.site.outputs.report_path != ''
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      with:
        artifact_name: midscene-e2e-report-pages-${{ github.run_attempt }}
    - name: Write screenshot table and native report links
      if: steps.deployment.outcome == 'success'
      shell: bash
      env:
        PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        PRODUCER_RESULT: ${{ inputs.producer-result }}
      run: |
        node "$GITHUB_ACTION_PATH/src/render-ci-summary.mjs" \
          --reports "$RUNNER_TEMP/midscene-pages-reports" \
          --pages-url "$PAGE_URL" \
          --run-id "$GITHUB_RUN_ID" \
          --producer-result "$PRODUCER_RESULT" \
          --output "$GITHUB_STEP_SUMMARY"
    - name: Explain incomplete report
      if: steps.site.outputs.report_path == ''
      shell: bash
      run: echo 'No complete native HTML report was produced. Pages was not replaced; inspect the downloadable artifacts for partial results.' >> "$GITHUB_STEP_SUMMARY"
